<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubleTen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar-w: 198px;
    --header-h: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #2c2b2b;
    font-family: 'Kanit', sans-serif;
    color: #fff;
  }

  .layout {
    display: flex;
    min-height: 100vh;
    position: relative;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: linear-gradient(to bottom, #872929 0%, #0d0a0a 100%);
    display: flex;
    flex-direction: column;
    padding: 14px 0 0 0;
    transition: width 0.2s ease;
    overflow: hidden;
  }

  .sidebar .logo {
    display: block;
    width: 127px;
    height: 92px;
    margin: 0 0 34px 36px;
  }

  .sidebar .menu-panel {
    background: rgba(18, 17, 17, 0.28);
    border-radius: 15px;
    margin: 0 15px;
    padding: 8px 0;
  }

  .sidebar .menu-panel ul {
    list-style: none;
  }

  .sidebar .menu-panel li {
    height: 40px;
    display: flex;
    align-items: center;
    padding-left: 34px;
    cursor: pointer;
    white-space: nowrap;
  }

  .sidebar .menu-panel li img {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
  }

  .sidebar .menu-panel li span {
    margin-left: 7px;
    font-weight: 400;
    font-size: 13px;
    color: #fff;
  }

  .sidebar .balance-box {
    margin: 13px 15px 0 15px;
    width: 170px;
  }

  .sidebar .balance-box img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ===== Collapsed menu (icon-only) ===== */
  .sidebar .menu-collapsed {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding-top: 15px;
  }

  .sidebar .menu-collapsed li {
    list-style: none;
    width: 35px;
    height: 35px;
    cursor: pointer;
  }

  .sidebar .menu-collapsed li img {
    width: 35px;
    height: 35px;
    display: block;
  }

  /* ===== Collapsed state ===== */
  .sidebar.collapsed {
    width: 56px;
  }

  .sidebar.collapsed .logo,
  .sidebar.collapsed .menu-panel,
  .sidebar.collapsed .balance-box {
    display: none;
  }

  .sidebar.collapsed .menu-collapsed {
    display: flex;
  }

  /* ===== Toggle arrow button ===== */
  .sidebar-toggle {
    position: absolute;
    top: 108px;
    left: calc(var(--sidebar-w) - 5px);
    width: 10px;
    height: 30px;
    background: #1a1a1a;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 10px;
    line-height: 30px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    z-index: 10;
    transition: left 0.2s ease;
  }

  /* ===== Header + main ===== */
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .header {
    height: var(--header-h);
    background: #121214;
    display: flex;
    align-items: center;
    padding-left: 25px;
    flex-shrink: 0;
  }

  .header .wordmark {
    display: none;
    font-size: 20px;
    font-weight: 400;
    color: #fff;
    margin-right: 26px;
    white-space: nowrap;
  }

  .sidebar.collapsed ~ .content-area .header {
    padding-left: 26px;
  }

  .sidebar.collapsed ~ .content-area .header .wordmark {
    display: block;
  }

  .header .icons {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .header img {
    width: 27px;
    height: 27px;
    cursor: pointer;
  }

  .main {
    flex: 1;
    background: #2c2b2b;
  }
</style>
</head>
<body>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <img class="logo" src="assets/LOGO_WEB_01.svg" alt="DoubleTen">

      <nav class="menu-panel">
        <ul>
          <li><img src="assets/HOME ICON.svg" alt=""><span>หน้าแรก</span></li>
          <li><img src="assets/NEWS ICON.svg" alt=""><span>อัพเดทข่าว</span></li>
          <li><img src="assets/ARTICLE ICON.svg" alt=""><span>บทความ</span></li>
          <li><img src="assets/SOCIETY ICON.svg" alt=""><span>บอร์ดโซไซตี้</span></li>
          <li><img src="assets/BALL_INTER ICON.svg" alt=""><span>บอร์ดบอลนอก</span></li>
          <li><img src="assets/BALL_THAI ICON.svg" alt=""><span>บอร์ดบอลไทย</span></li>
          <li><img src="assets/all sport icon.svg" alt=""><span>ออลสปอร์ต</span></li>
          <li><img src="assets/games icon.svg" alt=""><span>บอร์ดเกมส์</span></li>
          <li><img src="assets/deal icon.svg" alt=""><span>เดลล่างมอ</span></li>
          <li><img src="assets/Prisoner Icon.svg" alt=""><span>เรือนจำคนง่าว</span></li>
          <li><img src="assets/buy item icon.svg" alt=""><span>ซื้อไอเท็มเว็บ</span></li>
        </ul>
      </nav>

      <div class="balance-box">
        <img src="assets/balance.svg" alt="Balance">
      </div>

      <!-- Collapsed (icon-only) menu -->
      <ul class="menu-collapsed">
        <li><img src="assets/HOME ICON.svg" alt="หน้าแรก"></li>
        <li><img src="assets/NEWS ICON.svg" alt="อัพเดทข่าว"></li>
        <li><img src="assets/ARTICLE ICON.svg" alt="บทความ"></li>
        <li><img src="assets/SOCIETY ICON.svg" alt="บอร์ดโซไซตี้"></li>
        <li><img src="assets/BALL_INTER ICON.svg" alt="บอร์ดบอลนอก"></li>
        <li><img src="assets/BALL_THAI ICON.svg" alt="บอร์ดบอลไทย"></li>
        <li><img src="assets/all sport icon.svg" alt="ออลสปอร์ต"></li>
        <li><img src="assets/games icon.svg" alt="บอร์ดเกมส์"></li>
        <li><img src="assets/deal icon.svg" alt="เดลล่างมอ"></li>
        <li><img src="assets/Prisoner Icon.svg" alt="เรือนจำคนง่าว"></li>
        <li><img src="assets/buy item icon.svg" alt="ซื้อไอเท็มเว็บ"></li>
      </ul>
    </aside>

    <!-- Toggle arrow -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">&#10094;</button>

    <!-- Header + main content -->
    <div class="content-area">
      <header class="header">
        <span class="wordmark">DOUBLETEN</span>
        <div class="icons">
          <img src="assets/mynaui_bell.svg" alt="Notifications">
          <img src="assets/mynaui_mail.svg" alt="Messages">
        </div>
      </header>

      <main class="main">
        <!-- เนื้อหาส่วนกลาง/ขวา ยังไม่มีในดีไซน์นี้ (เฉพาะ sidebar + header เท่านั้น) -->
      </main>
    </div>

  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');

    toggleBtn.addEventListener('click', () => {
      const collapsed = sidebar.classList.toggle('collapsed');
      document.documentElement.style.setProperty('--sidebar-w', collapsed ? '56px' : '198px');
      toggleBtn.innerHTML = collapsed ? '&#10095;' : '&#10094;';
    });
  </script>

</body>
</html>
