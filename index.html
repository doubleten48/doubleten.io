<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoubleTen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar-w: 198px;
    --header-h: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #2c2b2b;
    font-family: 'Kanit', sans-serif;
    color: #fff;
  }

  .layout {
    display: flex;
    min-height: 100vh;
    position: relative;
  }

  /* ===== Sidebar ===== */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: linear-gradient(to bottom, #872929 0%, #0d0a0a 100%);
    display: flex;
    flex-direction: column;
    padding: 14px 0 0 0;
    transition: width 0.2s ease;
    overflow: hidden;
  }

  .sidebar .logo {
    display: block;
    width: 127px;
    height: 92px;
    margin: 0 0 34px 36px;
  }

  .sidebar .menu-panel {
    margin: 0 15px;
    position: relative;
    height: 403px;
  }

  .sidebar .menu-panel ul {
    list-style: none;
    position: relative;
    height: 100%;
  }

  .menu-highlight {
    position: absolute;
    left: 17px;
    width: 137px;
    height: 27px;
    background: rgba(29, 28, 28, 0.33);
    border-radius: 5px;
    z-index: 0;
    transition: top 0.2s ease;
    pointer-events: none;
  }

  .sidebar .menu-panel li {
    position: absolute;
    left: 0;
    right: 0;
    height: 40px;
    cursor: pointer;
    white-space: nowrap;
  }

  .sidebar .menu-panel li img {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1;
    display: block;
  }

  .sidebar .menu-panel li span {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    left: 52px;
    z-index: 1;
    font-weight: 400;
    font-size: 13px;
    color: #fff;
  }

  .sidebar .menu-divider {
    width: 163px;
    height: 1px;
    background: rgba(255, 255, 255, 0.15);
    margin: 0 auto 18px auto;
  }

  .sidebar .balance-box {
    margin: 0 15px;
    width: 170px;
  }

  .sidebar .balance-box img {
    display: block;
    width: 100%;
    height: auto;
  }

  /* ===== Collapsed menu (icon-only) ===== */
  .sidebar .menu-collapsed {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding-top: 15px;
  }

  .sidebar .menu-collapsed li {
    list-style: none;
    width: 35px;
    height: 35px;
    cursor: pointer;
  }

  .sidebar .menu-collapsed li img {
    width: 35px;
    height: 35px;
    display: block;
  }

  /* ===== Collapsed state ===== */
  .sidebar.collapsed {
    width: 56px;
  }

  .sidebar.collapsed .logo,
  .sidebar.collapsed .menu-panel,
  .sidebar.collapsed .menu-divider,
  .sidebar.collapsed .balance-box {
    display: none;
  }

  .sidebar.collapsed .menu-collapsed {
    display: flex;
  }

  /* ===== Toggle arrow button ===== */
  .sidebar-toggle {
    position: absolute;
    top: 108px;
    left: calc(var(--sidebar-w) - 5px);
    width: 10px;
    height: 30px;
    background: #1a1a1a;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 10px;
    line-height: 30px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    z-index: 10;
    transition: left 0.2s ease;
  }

  /* ===== Header + main ===== */
  .content-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .header {
    height: var(--header-h);
    background: #121214;
    display: flex;
    align-items: center;
    padding-left: 25px;
    flex-shrink: 0;
  }

  .header .wordmark {
    display: none;
    font-size: 20px;
    font-weight: 400;
    color: #fff;
    margin-right: 26px;
    white-space: nowrap;
  }

  .sidebar.collapsed ~ .content-area .header {
    padding-left: 26px;
  }

  .sidebar.collapsed ~ .content-area .header .wordmark {
    display: block;
  }

  .header .icons {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .header img {
    width: 27px;
    height: 27px;
    cursor: pointer;
  }

  .main {
    flex: 1;
    background: #2c2b2b;
  }
</style>
</head>
<body>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <img class="logo" src="assets/LOGO_WEB_01.svg" alt="DoubleTen">

      <nav class="menu-panel">
        <div class="menu-highlight" id="menuHighlight"></div>
        <ul id="menuList">
          <li style="top:9px"><img src="assets/HOME ICON_2.svg" alt="" style="left:21px;width:10px;height:12px"><span style="left:45px">หน้าแรก</span></li>
          <li style="top:46px"><img src="assets/NEWS ICON_2.svg" alt="" style="left:21px;width:13px;height:10.6px"><span style="left:45px">อัพเดทข่าว</span></li>
          <li style="top:79px"><img src="assets/ARTICLE ICON_2.svg" alt="" style="left:21px;width:10px;height:10px"><span style="left:45px">บทความ</span></li>
          <li style="top:115px"><img src="assets/SOCIETY ICON_2.svg" alt="" style="left:21px;width:11px;height:10px"><span style="left:44px">บอร์ดโซไซตี้</span></li>
          <li style="top:148px"><img src="assets/BALL_INTER ICON_2.svg" alt="" style="left:21px;width:11px;height:14px"><span style="left:44px">บอร์ดบอลนอก</span></li>
          <li style="top:182px"><img src="assets/BALL_THAI ICON_2.svg" alt="" style="left:21px;width:9px;height:13px"><span style="left:44px">บอร์ดบอลไทย</span></li>
          <li style="top:214px"><img src="assets/all sport icon_2.svg" alt="" style="left:21px;width:11px;height:15px"><span style="left:44px">ออลสปอร์ต</span></li>
          <li style="top:250px"><img src="assets/games icon_2.svg" alt="" style="left:21px;width:12px;height:12px"><span style="left:44px">บอร์ดเกมส์</span></li>
          <li style="top:282px"><img src="assets/deal icon_2.svg" alt="" style="left:21px;width:13px;height:13px"><span style="left:44px">เดลล่างมอ</span></li>
          <li style="top:316px"><img src="assets/Prisoner Icon_2.svg" alt="" style="left:21px;width:12px;height:13px"><span style="left:44px">เรือนจำคนง่าว</span></li>
          <li style="top:353px"><img src="assets/buy item icon_2.svg" alt="" style="left:21px;width:13px;height:13px"><span style="left:44px">ซื้อไอเท็มเว็บ</span></li>
        </ul>
      </nav>

      <div class="menu-divider"></div>

      <div class="balance-box">
        <img src="assets/balance.svg" alt="Balance">
      </div>

      <!-- Collapsed (icon-only) menu -->
      <ul class="menu-collapsed">
        <li><img src="assets/HOME ICON.svg" alt="หน้าแรก"></li>
        <li><img src="assets/NEWS ICON.svg" alt="อัพเดทข่าว"></li>
        <li><img src="assets/ARTICLE ICON.svg" alt="บทความ"></li>
        <li><img src="assets/SOCIETY ICON.svg" alt="บอร์ดโซไซตี้"></li>
        <li><img src="assets/BALL_INTER ICON.svg" alt="บอร์ดบอลนอก"></li>
        <li><img src="assets/BALL_THAI ICON.svg" alt="บอร์ดบอลไทย"></li>
        <li><img src="assets/all sport icon.svg" alt="ออลสปอร์ต"></li>
        <li><img src="assets/games icon.svg" alt="บอร์ดเกมส์"></li>
        <li><img src="assets/deal icon.svg" alt="เดลล่างมอ"></li>
        <li><img src="assets/Prisoner Icon.svg" alt="เรือนจำคนง่าว"></li>
        <li><img src="assets/buy item icon.svg" alt="ซื้อไอเท็มเว็บ"></li>
      </ul>
    </aside>

    <!-- Toggle arrow -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">&#10094;</button>

    <!-- Header + main content -->
    <div class="content-area">
      <header class="header">
        <span class="wordmark">DOUBLETEN</span>
        <div class="icons">
          <img src="assets/mynaui_bell.svg" alt="Notifications">
          <img src="assets/mynaui_mail.svg" alt="Messages">
        </div>
      </header>

      <main class="main">
        <!-- เนื้อหาส่วนกลาง/ขวา ยังไม่มีในดีไซน์นี้ (เฉพาะ sidebar + header เท่านั้น) -->
      </main>
    </div>

  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');

    toggleBtn.addEventListener('click', () => {
      const collapsed = sidebar.classList.toggle('collapsed');
      document.documentElement.style.setProperty('--sidebar-w', collapsed ? '56px' : '198px');
      toggleBtn.innerHTML = collapsed ? '&#10095;' : '&#10094;';
    });

    // Sliding menu highlight follows the hovered item
    const menuList = document.getElementById('menuList');
    const highlight = document.getElementById('menuHighlight');
    const menuItems = menuList.querySelectorAll('li');
    const defaultActiveIndex = 0; // หน้าแรก

    function moveHighlightTo(li) {
      highlight.style.top = (li.offsetTop + (li.offsetHeight - 27) / 2) + 'px';
    }

    if (menuItems.length) {
      moveHighlightTo(menuItems[defaultActiveIndex]);
    }

    menuItems.forEach((li) => {
      li.addEventListener('mouseenter', () => moveHighlightTo(li));
    });

    menuList.addEventListener('mouseleave', () => {
      moveHighlightTo(menuItems[defaultActiveIndex]);
    });
  </script>

</body>
</html>
